        value: "7015769205"
      - key: INSTAGRAM_URL
        value: "https://www.instagram.com/vaibhav_garments_padha_0/"
      - key: SHOP_ADDRESS
        value: "Village Padha, Tehsil Assandh, District Karnal, Haryana - 132036"
